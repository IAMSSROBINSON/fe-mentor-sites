<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>
    <meta name="description" content="Blog Preview Card Site">
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>

    <article class="card-container">
        <figure class="card-image-container">
            <img src="./assets/images/illustration.svg" alt="Creative card decorative illustration" class="card-image"/>
        </figure>

        <div class="card-content-container">
            <p class="card-label">Learning</p>
            <p class="card-date">Published 21 Dec 2023</p>
            <h3 class="card-title">HTML & CSS foundations</h3>
            <p class="card-description">
                These languages are the backbone of every website, defining structure, content, and presentation.
            </p>
        </div>

        <figure class="card-avatar-container">
            <img src="./assets/images/avatar.webp" class="card-avatar-image" alt="Profile image" />
            <figcaption class="card-avatar-name">Greg Hooper</figcaption>
        </figure>
  

    </article>

    <script src="./js/main.js"></script>
</body>
</html>
