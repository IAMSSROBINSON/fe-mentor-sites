<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta char="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <meta name="description" content="News Homepage">
    <title>News Homepage</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon-32x32.ico?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="blur-wrapper" class="blur-wrapper" aria-hidden="true"></div>
    <header class="header">
            <img class="logo-icon" src="./assets/icons/logo.svg" alt="W. logo-text-icon" />
        <nav>
            <menu id="modal-menu" class="modal-menu" hidden aria-hidden="true">
                <button id="modal-button-close" class="modal-button-close">
                    <img id="close-modal-menu-icon" class="close-modal-menu-icon" src="./assets/icons/icon-menu-close.svg" alt="Close modal icon">
                </button>
                
                <ul id="modal-menu-list " class="modal-menu-list">
                    <li class="menu-item home"><a href="#">Home</a>
                    <li class="menu-item new"><a href="#">New</a></li>
                    <li class="menu-item popular"><a href="#">Popular</a></li>
                    <li class="menu-item trending"><a href="#">Trending</a></li>
                    <li class="menu-item categories"><a href="#">Categories</a></li>
                </ul>
            </menu>
            <button id="menu-button-open" class="menu-button-open">
                <img id="menu-icon" class="menu-icon" src="./assets/icons/icon-menu.svg" alt="Menu icon">
            </button>
            <menu id="menu-container" class="menu-container">
                <ul id="menu-list" class="menu-list">
                    <li class="menu-item home"><a href="#">Home</a>
                    <li class="menu-item new"><a href="#">New</a></li>
                    <li class="menu-item popular"><a href="#">Popular</a></li>
                    <li class="menu-item trending"><a href="#">Trending</a></li>
                    <li class="menu-item categories"><a href="#">Categories</a></li>
                </ul>
            </menu>
        </nav>
    </header>



    <script type="module" src="./app.js"></script>
</body>
</html>
