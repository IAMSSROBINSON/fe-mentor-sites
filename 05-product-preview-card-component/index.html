<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Card Component</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/icons/favicon-32x32.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/media-queries.css">
</head>
<body>

    <main>
        <article class="card-container">
            <picture class="card-image-container">
                <source media="(max-width: 600px)" srcset="./assets/images/image-product-mobile.jpg" type="image/jpg">
                <img src="./assets/images/image-product-desktop.jpg" alt="Luxurious Perfume bottle" class="hero-image"/>
            </picture>
            <div class="card-content-container">
                <p class="card-label">Perfume</p> 
                <h1 class="card-title">Gabrielle Essence Eau De Parfum</h1>
                <p class="card-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
                <div class="card-price-container">
                    <p class="card-price">$149.99</p>
                    <p class="card-price-old">$169.99</p>
                </div>
                <button type="button" class="card-button" aria-label="Click to add item to cart">
                    <svg class="cart-icon" width="15" height="16" xmlns="http://www.w3.org/2000/svg"><path d="M14.383 10.388a2.397 2.397 0 0 0-1.518-2.222l1.494-5.593a.8.8 0 0 0-.144-.695.8.8 0 0 0-.631-.28H2.637L2.373.591A.8.8 0 0 0 1.598 0H0v1.598h.983l1.982 7.4a.8.8 0 0 0 .799.59h8.222a.8.8 0 0 1 0 1.599H1.598a.8.8 0 1 0 0 1.598h.943a2.397 2.397 0 1 0 4.507 0h1.885a2.397 2.397 0 1 0 4.331-.376 2.397 2.397 0 0 0 1.12-2.021ZM11.26 7.99H4.395L3.068 3.196h9.477L11.26 7.991Zm-6.465 6.392a.8.8 0 1 1 0-1.598.8.8 0 0 1 0 1.598Zm6.393 0a.8.8 0 1 1 0-1.598.8.8 0 0 1 0 1.598Z" fill="currentColor"/></svg>
                    <span class="card-button-text">Add to Cart</span>
                </button>
            </div>
        </article>
    </main>

</body>
</html>
