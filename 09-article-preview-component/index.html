<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Article Preview Component">
    <meta name="robots" content="index,follow">
    <title>Article Preview Component</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/icons/favicon-32x32.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/media_queries.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="card">
        <header class="header-container">
            <figure class="hero-image-container">

            </figure>
        </header>
        <main class="main-container">
            <h1 class="title">Shift the overall look and feel by adding these wonderful touches to furniture in your
                home</h1>
            <p class="description">Ever been in a room and felt like something was missing? Perhaps it felt slightly
                bare and uninviting. I’ve got some simple tips to help you make any room feel complete.</p>
            <footer class="footer-container">
                <div class="avatar-container">
                    <img src="./assets/images/avatar-michelle.jpg" alt="Stylish female profile picture"
                        img="avatar-image" />
                </div>
                <div class="content-container">
                    <h2 class="avatar-name">Michelle Appleton</h2>
                    <time class="avatar-time" datetime="28-06-2020">28 Jun 2020</time>
                    <div class="share-container">
                        <img src="./assets/images/icons/icon-share.svg" alt="Share" class="share-image" />
                    </div>
                </div>
            </footer>
        </main>

    </div>


    <script src="./js/main.js"></script>
</body>

</html>
