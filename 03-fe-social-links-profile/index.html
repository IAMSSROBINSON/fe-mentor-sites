<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Profile</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon-32x32.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/index.css">
</head>

<body>
    <main>
        <article class="card-container">
            <div class="avatar-container item">
                <img src="assets/images/avatar-jessica.jpeg" alt="profile picture" class="avatar">
            </div>
            <div class="personal-details-container item">
                <h1 class="profile-name">Jessica Randall</h1>
                <address class="address-container">
                    <p class="address-details">
                        London, United Kingdom
                    </p>
                </address>
            </div>
            <blockquote class="description item">
                "Front-end developer and avid reader."
            </blockquote>
            <div class="links-container">
                <a href="https://github.com/" target="_blank" rel="noopener noreferrer" aria-label="Github profile">GitHub</a>

                <a href="https://www.frontendmentor.io" target="_blank" rel="noopener noreferrer" arial-label="Frontend Mentor profile">Frontend Mentor</a>

                <a href="http://linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn Profile">LinkedIn</a>
                
                <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="Twitter Profile">Twitter</a>
                <a href="http://instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile">Instagram</a>
            </div>
        </article>
    </main>

</body>

</html>
