<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Profile</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon-32x32.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="/assets/css/index.css">
</head>
<body>
    <main>
        <article class="card-container">
        <div class="avatar-container item">
                <img src="assets/images/avatar-jessica.jpeg" alt="profile picture" class="avatar">
        </div>
        <div class="personal-details-container item">
            <h1 class="profile-name">Jessica Randall</h1>
            <address class="address-container">
                <p class="address-details">
                    London, United Kingdom
                </p>
            </address>
        </div>
        <blockquote class="description item">
            "Front-end developer and avid reader."
        </blockquote>
        <ul class="links-container">
            <li><a href="#" target="_blank">GitHut</li>
            <li><a href="#" target="_blank">Frontend Mentor</li>
            <li><a href="#" target="_blank">LinkedIn</li>
            <li><a href="#" target="_blank">Twitter</li>
            <li><a href="#" target="_blank">Instagram</li>
        </ul>
        </article>
    </main>

</body>
</html>
