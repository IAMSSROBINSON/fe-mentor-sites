<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <meta name="description" content="Interactive Rating Component Front End Engineering Project">
    <title>Interactive Rating Component</title>
    <link rel="icon" type="x-icon/image" href="./assets/icons/favicon-32x32.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <main class="main-container">

        <article class="card">
            <div class="star-container">
                <svg aria-hidden="true" viewBox="0 0 18 16" class="star-icon-wrapper" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="m9.067.43 1.99 4.031c.112.228.33.386.58.422l4.45.647a.772.772 0 0 1 .427 1.316l-3.22 3.138a.773.773 0 0 0-.222.683l.76 4.431a.772.772 0 0 1-1.12.813l-3.98-2.092a.773.773 0 0 0-.718 0l-3.98 2.092a.772.772 0 0 1-1.119-.813l.76-4.431a.77.77 0 0 0-.222-.683L.233 6.846A.772.772 0 0 1 .661 5.53l4.449-.647a.772.772 0 0 0 .58-.422L7.68.43a.774.774 0 0 1 1.387 0Z"
                        fill="#FC7614" />
                </svg>
            </div>

            <h1 class="main-heading">How did we do?</h1>

            <p class="body-text">
                Please let us know how we did with your support request. All feedback is appreciated to help us improve
                our offering!
            </p>

            <form id="rating-form" class="rating-form" novalidate>
                <!-- RATING NUMBERS 1 - 5 -->
                <fieldset>
                    <legend class="sr-only">Select your rating</legend>

                    <input type="radio" id="radio-1" class="radio-1 radio" name="rating" value="1">
                    <label for="radio-1" class="label"><span class="rating-text">1</span></label>

                    <input type="radio" id="radio-2" class="radio-2 radio" name="rating" value="2">
                    <label for="radio-2" class="label"><span class="rating-text">2</span></label>

                    <input type="radio" id="radio-3" class="radio-3 radio" name="rating" value="3">
                    <label for="radio-3" class="label"><span class="rating-text">3</span></label>

                    <input type="radio" id="radio-4" class="radio-4 radio" name="rating" value="4">
                    <label for="radio-4" class="label"><span class="rating-text">4</span></label>

                    <input type="radio" id="radio-5" class="radio-5 radio" name="rating" value="5">
                    <label for="radio-5" class="label"><span class="rating-text">5</span></label>
                </fieldset>

                <!-- SUBMIT BUTTON -->
                <button type="submit" id="submit-btn" class="submit-btn"><span
                        class="submit-text">submit</span></button>
            </form>
        </article>

    </main>

    <script type="module" src="./app.js"></script>
</body>
</html>
