<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <meta name="description" content="Newsletter sign-up form with success message">
    <title>Newsletter Sign-Up Form With Success Message</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/icons/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/media_queries.css">
</head>

<body>
    
    <div class="card">
        <figure class="hero-container">
            <img src="./assets/images/illustration-sign-up-mobile.svg" alt="Decorative image of flying computer objects">
        </figure>
        <main class="card-content-container">
            <h1 class="heading">Stay updated!</h1>
            <p class="sub-heading">Join 60,000+ product managers receiving monthly updates on:</p>
            <ul class="card-list flex">
                <li>Product discovery and building what matters</li>
                <li>Measuring to ensure updates are a success</li>
                <li>And much more!</li>
            </ul>
            <form id="card-form" action="#" method="#">
                <div class="email-container flex">
                    <label for="email" class="label">Email address</label>
                    <input type="email" name="email" id="email" placeholder="ash@loremcompany.com" class="email-input">
                </div>
                 <button type="submit" class="submit-btn">Subscribe to monthly newsletter</button>
            </form>
        </main>
    </div>
    <script src="./js/main.js"></script>
</body>

</html>
