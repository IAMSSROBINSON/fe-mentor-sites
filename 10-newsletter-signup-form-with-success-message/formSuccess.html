<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <meta name="description" content="Newsletter sign-up form with success message">
    <title>Newsletter Sign-Up Form With Success Message</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/icons/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/media_queries.css">
    <link rel="stylesheet" href="./css/success.css">
    <link rel="stylesheet" href="./css/success_media_queries.css">
</head>
<body>
    <main class="success-card">
        <div class="success-image-container">
            <img src="./assets/images/icons/icon-success.svg" alt="Success check mark / Tick" class="success-icon">
        </div>
        <h1 class="heading">Thanks for subscribing!</h1>
        <p class="sub-heading">A confirmation email has been sent to <span class="insert-email">ash@loremcompany.com</span>. Please open it and click the button inside to confirm your subscription.</p>
        <button type="button" class="submit-btn">Dismiss message</button>
    </main>

    <script src="./formSuccess.js"></script>
</body>
</html>
