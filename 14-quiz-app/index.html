<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <meta name="description" content="Test your knowledge with a fast, interactive multi-page Quiz Application across multiple genres">
    <title>Quiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon-32x32.ico">

    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <!-- render switch element inside header -->
    <header id="header" class="header">
        <div id="switch-container" class="switch-container">
            <img src="/assets/images/icon-sun-dark.svg" alt="sun icon" id="sun-icon" class="sun-icon"/>

            <div id="thumb-container" class="thumb-container">
                <div id="switch-thumb" class="switch-thumb"></div>
            </div>

            <img src="/assets/images/icon-moon-dark.svg" alt="moon icon" id="moon-icon" class="moon-icon"/>
        </div>
    </header>

    <!-- main content container with top and bottom sections -->
     <main id="main" class="main">
        <section class="top">

            <h1>
            <span class="title-mob-l">Welcome to the</span>
            <span class="title-mob-m">Frontend Quiz!</span>
            </h1>
            <p class="subtitle">Pick a subject to get started.</p>
            
        </section>

        <section class="bottom">
            
        </section>
     </main>


    <script src="./app.js" type="module"></script>
</body>
</html>
