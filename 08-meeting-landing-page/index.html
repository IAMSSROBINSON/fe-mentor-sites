<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Landing Page</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/icons/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/media_queries.css">
</head>

<body>
    <header class="header">
        <div class="logo-container flex-center">
            <img src="./assets/images/icons/logo.svg" alt="Company name" width="118" height="28" class="logo">
        </div>
    </header>

    <section class="hero-container">
        <div class="hero-image-container-1">
            <img src="./assets/images/desktop/image-hero-left.png" class="hero-image hero-image-left">
        </div>

        <div class="hero-image-container-0">
            <img src="./assets/images/tablet/image-hero.png" class="hero-image hero-image-mobile">
        </div>

        <div class="hero-content-container">
            <h1>
                Group Chat<br>for Everyone
            </h1>
            <p>
                Meet makes it easy to connect with others face-to-face virtually and collaborate across any device.
            </p>
            <div class="hero-buttons-container">
                <button type="button" class="hero-button-left button">
                    Download<span>v1.3</span>
                </button>
                <button type="button" class="hero-button-right button">What is it?</button>
            </div>
        </div>


        <div class="hero-image-container-2">
            <img src="./assets/images/desktop/image-hero-right.png" class="hero-image hero-image-right">
        </div>
    </section>

    <div class="separator-container">
        <div class="separator-line"></div>
        <p class="separator-number">01</p>
    </div>

</body>

</html>
