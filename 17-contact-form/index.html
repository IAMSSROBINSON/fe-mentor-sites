<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <meta name="description" content="Accessible Contact Form">
    <title>Contact Form</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon-32x32.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <main class="card">
        <h1 class="title">Contact Us</h1>

        <form id="contact-us-form" method="#" action="#">
            
            <fieldset class="container person-details-container">
                <legend class="sr-only">Personal Details</legend>

                <!-- first name -->
                <label for="first-name">First Name <span class="require-star"> *</span></label>
                <input type="text" id="first-name" name="first-name" required autocomplete="first-name" aria-invalid="true" aria-describedby="first-name-error">
                <p id="first-name-error" class="error-text">This field is required</p>


            </fieldset>

            <button type="submit" id="submit-button" class="submit-button">Submit</button>
        </form>
    </main>
    <script src="./main.js"></script>
</body>
</html>
