<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <meta name="description" content="Accessible Contact Form">
    <title>Contact Form</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon-32x32.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <main class="card">
        <h1 class="title">Contact Us</h1>

        <form id="contact-us-form" method="#" action="#" novalidate>

            <fieldset class="container person-details-container ">
                <legend class="sr-only">Personal Details</legend>

                <div class="form-row">
                    <!-- first name -->
                    <div class="form-group">
                        <label for="first-name" class="label-title">First Name<span class="required-star">*</span></label>
                        <input type="text" id="first-name" name="first-name" required autocomplete="given-name" aria-describedby="first-name-error">
                        <p id="first-name-error" class="error-text" aria-live="polite"></p>
                    </div>

                    <!-- last name -->
                    <div class="form-group ln field">
                        <label for="last-name" class="label-title">Last Name<span class="required-star">*</span></label>
                        <input type="text" id="last-name" name="last-name" required autocomplete="family-name" aria-describedby="last-name-error">
                        <p id="last-name-error" class="error-text" aria-live="polite"></p>
                    </div>
                </div>
        
            </fieldset>

            <fieldset class="field">
                <legend class="sr-only">Email Address</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email" class="label-title">Email Address<span class="required-star">*</span></label>
                        <input type="email" id="email" name="email" required aria-describedby="email-error" autocomplete="email">
                        <p id="email-error" class="error-text" aria-live="polite"></p>
                    </div>
                </div>
            </fieldset>

            <fieldset class="field">
                <legend class="sr-only">Select the type of query</legend>
                <label for="general-enquiry" class="label-title">Query Type<span class="required-star">*</span></label>
                <div class="form-row radio-row">
                    <div class="form-group">
                        <div class="radio-group">
                            <input type="radio" name="query-type" id="general-enquiry" value="general-enquiry" aria-describedby="query-type-error" required>
                            <label for="general-enquiry">General Enquiry</label>
                        </div>
                           
                    </div>
                 
                    <div class="form-group ln field">
                        <div class="radio-group">
                            <input type="radio" name="query-type" id="support-request" value="support-request" aria-describedby="query-type-error">
                        <label for="support-request">Support Request</label>
                        </div>
                        
                    </div>
                    
                </div>
                <p id="query-type-error" class="error-text" aria-live="polite"></p>
            </fieldset>

            <fieldset class="field">
                <legend class="sr-only">Type a message</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="message" class="label-title">Message<span class="required-star">*</span></label>
                        <textarea name="message" id="message" class="message-area" rows="3" aria-describedby="message-error" required></textarea>
                        <p id="message-error" class="error-text" aria-live="polite"></p>
                    </div>
                </div>

            </fieldset>

            <fieldset class="field">
                <legend class="sr-only">Check the box to consent to being contacted by the team</legend>
                <div class="form-row">
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="consent" name="consent" aria-describedby="consent-error" required value="true">
                            <label for="consent">I consent to being contacted by the team<span class="required-star">*</span></label>
                        </div>
                        <p id="consent-error" class="error-text" aria-live="polite"></p>
                    </div>
                    
                </div>
            </fieldset>

            <button type="submit" id="submit-button" class="submit-button">Submit</button>
        </form>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
