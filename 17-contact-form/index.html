<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <meta name="description" content="Accessible Contact Form">
    <title>Contact Form</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/favicon-32x32.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <main class="card">
        <h1 class="title">Contact Us</h1>

        <form id="contact-us-form" method="#" action="#">

            <fieldset class="container person-details-container">
                <legend class="sr-only">Personal Details</legend>

                

                <div class="form-row">
                    <!-- first name -->
                    <div class="form-group">
                        <label for="first-name">First Name <span class="required-star"> *</span></label>
                        <input type="text" id="first-name" name="first-name" required autocomplete="given-name" aria-invalid="true" aria-describedby="first-name-error">
                        <p id="first-name-error" class="error-text">This field is required</p>
                    </div>

                    <!-- last name -->
                    <div class="form-group">
                        <label for="last-name">Last Name <span class="required-star"> *</span></label>
                        <input type="text" id="last-name" name="last-name" required autocomplete="family-name" aria-invalid="true" aria-describedby="last-name-error">
                        <p id="last-name-error" class="error-text">This field is required</p>
                    </div>
                </div>
        
            </fieldset>

            <fieldset>
                <legend class="sr-only">Email Address</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address<span class="required-star">*</span></label>
                        <input type="email" id="email" name="email" required aria-invalid="true" aria-describedby="email-error">
                        <p id="email-error" class="error-text">This field is required</p>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend class="sr-only">Select the type of query</legend>
                <label for="radios">Query Type <span class="required-star">*</span></label>
                <div class="form-row radio-row">
                    <div class="form-group">
                        <div class="radio-group">
                            <input type="radio" name="query-type" id="general-enquiry" value="general-enquiry" aria-describedby="radio-error-1">
                            <label for="general-enquiry">General Enquiry</label>
                        </div>
                           <p id="radio-error-1" class="error-text">This field is required</p>
                    </div>
                 

                    <div class="form-group">
                        <div class="radio-group">
                            <input type="radio" name="query-type" id="support-request" value="support-request" aria-describedby="radio-error-2">
                        <label for="support-request">Support Request</label>
                        </div>
                        <p id="radio-error-2" class="error-text">This field is required</p>
                        
                    </div>
                </div>
            </fieldset>

            <button type="submit" id="submit-button" class="submit-button">Submit</button>
        </form>
    </main>
    <script src="./main.js"></script>
</body>
</html>
